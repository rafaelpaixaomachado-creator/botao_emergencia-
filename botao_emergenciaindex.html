<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#8b0f1c"
    >

    <title>App Emergência</title>

    <!-- Arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         CABEÇALHO
    =============================== -->

    <header class="app-header">
        <h1>Assistência Pessoal</h1>

        <p>
            Toque no botão central em caso de emergência
        </p>
    </header>


    <!-- ==============================
         BOTÃO DE EMERGÊNCIA
    =============================== -->

    <main class="panic-button-container">

        <div
            class="pulse-ring"
            aria-hidden="true"
        ></div>

        <button
            id="panicButton"
            class="panic-btn"
            type="button"
            onclick="acionarEmergencia()"
            aria-label="Acionar emergência"
        >
            S.O.S
        </button>

    </main>


    <!-- ==============================
         STATUS
    =============================== -->

    <div
        id="status"
        class="status-text"
        role="status"
        aria-live="polite"
    >
        Alerta preparado!
    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>

        /*
         * Mostra uma mensagem de status
         */
        function mostrarStatus(mensagem, erro = false) {

            const status = document.getElementById("status");

            status.textContent = mensagem;

            status.classList.toggle("error", erro);

            status.classList.add("show");

            setTimeout(() => {
                status.classList.remove("show");
            }, 3000);
        }


        /*
         * Vibração do celular
         */
        function vibrar() {

            if ("vibrate" in navigator) {

                navigator.vibrate([
                    200,
                    100,
                    200
                ]);
            }
        }


        /*
         * Obtém a localização atual
         */
        function obterLocalizacao() {

            return new Promise((resolve, reject) => {

                if (!navigator.geolocation) {

                    reject(
                        new Error(
                            "Geolocalização não é suportada neste dispositivo."
                        )
                    );

                    return;
                }


                navigator.geolocation.getCurrentPosition(

                    position => {

                        resolve({

                            latitude:
                                position.coords.latitude,

                            longitude:
                                position.coords.longitude,

                            precisao:
                                position.coords.accuracy
                        });
                    },


                    error => {

                        reject(error);
                    },


                    {
                        enableHighAccuracy: true,

                        timeout: 10000,

                        maximumAge: 0
                    }
                );
            });
        }


        /*
         * Aciona a emergência
         */
        async function acionarEmergencia() {

            const botao =
                document.getElementById("panicButton");


            // Vibra o celular
            vibrar();


            // Desativa o botão enquanto processa
            botao.disabled = true;


            // Informa o usuário
            mostrarStatus(
                "Obtendo sua localização..."
            );


            try {

                const localizacao =
                    await obterLocalizacao();


                console.log(
                    "Localização obtida:",
                    localizacao
                );


                mostrarStatus(
                    "Localização obtida com sucesso!"
                );


                setTimeout(() => {

                    alert(

                        "🚨 EMERGÊNCIA ACIONADA!\n\n" +

                        "Localização obtida:\n" +

                        "Latitude: " +
                        localizacao.latitude.toFixed(6) +

                        "\n" +

                        "Longitude: " +
                        localizacao.longitude.toFixed(6) +

                        "\n\n" +

                        "A localização ainda NÃO foi enviada " +
                        "para contatos.\n\n" +

                        "Para isso, é necessário conectar " +
                        "o aplicativo a um servidor/API."

                    );

                }, 500);


            } catch (erro) {

                console.error(
                    "Erro ao obter localização:",
                    erro
                );


                mostrarStatus(
                    "Não foi possível obter sua localização.",
                    true
                );


                setTimeout(() => {

                    alert(

                        "🚨 EMERGÊNCIA ACIONADA!\n\n" +

                        "Não foi possível obter sua localização.\n\n" +

                        "Verifique se o GPS/localização " +
                        "está ativado e se o navegador " +
                        "possui permissão."

                    );

                }, 500);


            } finally {

                setTimeout(() => {

                    botao.disabled = false;

                }, 1000);
            }
        }

    </script>

</body>

</html>
